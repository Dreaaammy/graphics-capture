name: Capture and inspect a game frame

on:
  workflow_dispatch:
    inputs:
      driver:
        description: Game renderer
        type: choice
        options: [gl, vulkan]
        default: gl

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: "4"
      ALSOFT_DRIVERS: "null"
    steps:
      - name: Install official distribution packages
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates renderdoc python3-renderdoc xvfb mesa-utils mesa-vulkan-drivers vulkan-tools supertuxkart spirv-tools glslang-tools
          dpkg-query -W renderdoc python3-renderdoc supertuxkart mesa-vulkan-drivers
      - uses: actions/checkout@v4
      - name: Capture and replay
        run: |
          mkdir -p artifacts
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash scripts/remote_capture.sh '${{ inputs.driver }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-capture-${{ inputs.driver }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
