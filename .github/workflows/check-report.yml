name: Verify the report and captured evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-report.txt
      - name: Install the report dependencies and free fonts
        run: |
          python -m pip install -r requirements-report.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Verify the submitted PDF and source evidence
        run: python scripts/check_report.py
      - name: Rebuild the report independently on Linux
        run: |
          python scripts/build_report.py --font-dir /usr/share/fonts/truetype/dejavu
          python scripts/check_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: independently-rebuilt-report
          path: output/pdf/capture_report.pdf
